name: CI

on:
  push:
    branches: [main, "dev-*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway Postgres for integration tests (same image as local docker compose).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: storyweaver
          POSTGRES_PASSWORD: ci-only-password  # pragma: allowlist secret (throwaway CI container)
          POSTGRES_DB: storyweaver
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storyweaver" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      # No 'gpu' extra: CI doesn't need the multi-GB CUDA torch wheels.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "unit or integration"
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://storyweaver:ci-only-password@localhost:5432/storyweaver_test  # pragma: allowlist secret
      # HF Gradio Spaces install our requirements.txt together with gradio[oauth,mcp], spaces and a torch cap.
      # Resolve that exact set for the Space's platform so conflicts fail here, not in the Space build.
      - name: Check the Space can install our requirements
        run: |
          uv export --frozen --no-dev --extra gpu --no-emit-project --no-hashes -o /tmp/space-req.txt
          GRADIO=$(grep -oP '^gradio==\K[^\s;]+' /tmp/space-req.txt)
          SPACES=$(grep -oP '^spaces==\K[^\s;]+' /tmp/space-req.txt)
          printf '%s\n' "torch<=2.13.0" "gradio[oauth,mcp]==$GRADIO" "uvicorn>=0.14.0" "websockets>=10.4" \
            "spaces==$SPACES" >> /tmp/space-req.txt
          uv pip compile --quiet --python-platform x86_64-unknown-linux-gnu --python-version 3.12 \
            /tmp/space-req.txt -o /tmp/space-resolved.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
