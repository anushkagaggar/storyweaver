name: Deploy backend to HF Space

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      space_id:
        description: "A test Space to deploy this branch to, e.g. <user>/storyweaver-test. Empty = production (tags only)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Without `spaces`: HF installs its own current version next to ours, and two pins can't both win.
      - name: Export requirements.txt from uv.lock
        run: >-
          uv export --frozen --no-dev --extra gpu --no-emit-project --no-emit-package spaces --no-hashes
          -o requirements.txt
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # A manual run may target a test Space; production only ever gets a v* tag (V3 release policy).
          HF_SPACE_ID: ${{ inputs.space_id || vars.HF_SPACE_ID }}
          PRODUCTION_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          COMMIT_MESSAGE: Deploy ${{ github.ref_name }} (${{ github.sha }})
        run: |
          if [ "$HF_SPACE_ID" = "$PRODUCTION_SPACE_ID" ] && [ "${GITHUB_REF#refs/tags/v}" = "$GITHUB_REF" ]; then
            echo "Only a v* tag deploys to the production Space; give a test space_id to deploy $GITHUB_REF." >&2
            exit 1
          fi
          uv run --no-project --with "huggingface_hub>=1.0" python ../.github/scripts/deploy_space.py
