name: Deploy backend to HF Space

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Export requirements.txt from uv.lock
        run: uv export --frozen --no-dev --extra gpu --no-emit-project --no-hashes -o requirements.txt
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          COMMIT_MESSAGE: Deploy ${{ github.ref_name }} (${{ github.sha }})
        run: uv run --no-project --with "huggingface_hub>=1.0" python ../.github/scripts/deploy_space.py
