# Local mirror of production. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
name: storyweaver

services:
  api:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://storyweaver:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/storyweaver
      REDIS_URL: redis://redis:6379/0
      # Narration audio goes to the local SeaweedFS (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY from .env).
      # Presigned URLs are signed for localhost:8333, the host the browser uses.
      S3_ENDPOINT_URL: http://s3:8333
      S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
      S3_BUCKET: storyweaver-audio
      S3_CREATE_BUCKET: "true"
      # auto, as on the Space: Orpheus while its quota lasts, then Kokoro. Local and production share one
      # Groq organisation (about one Orpheus story a day between them) but not one Redis, so local runs
      # can use up production's Orpheus quota; set TTS_ENGINE=kokoro in .env to keep them off it.
      TTS_ENGINE: ${TTS_ENGINE:-auto}
      # Kokoro's ONNX files live in the mounted HF cache on D:, so rebuilds don't re-download them.
      KOKORO_DIR: /home/app/.cache/huggingface/storyweaver-kokoro
      # Real pictures on the local GPU (imaging/sd15.py); SD 1.5's weights go to the same mounted cache on D:.
      # Set IMAGE_ENGINE=placeholder in .env for fast runs without the GPU.
      IMAGE_ENGINE: ${IMAGE_ENGINE:-sd15}
      # Plain HTTPS model downloads: HF's Xet CDN stalled and dropped the 2.6 GB SD 1.5 fetch here (16 Nov 2026),
      # while plain downloads ran steadily and resume after a failure.
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "7860:7860"
    volumes:
      - ${HF_HOME_HOST:-D:/hf}:/home/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      STORYWEAVER_API_URL: http://api:7860
      STORYWEAVER_API_KEY: ${STORYWEAVER_API_KEY:?set STORYWEAVER_API_KEY in .env}
      # Sign-in (V3, frontend/lib/auth.ts). The api reads USER_TOKEN_SECRET from .env too. Without the Google
      # client, the site shows the sign-in page but can't sign anyone in (the smoke test signs its own cookie).
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?set USER_TOKEN_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
      # Keep Next's build and dev log off the Windows bind mount: the poller saw each log write as a code change
      # and reloaded the page, which wrote another log line (an endless reload loop).
      - web_next:/app/.next
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: storyweaver
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver -d storyweaver"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible stand-in for Backblaze B2 (ADR-0004). MinIO's images were removed from Docker Hub,
  # so this uses SeaweedFS (Apache-2.0). S3 API on :8333; credentials are a global admin identity.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data

volumes:
  pg_data:
  s3_data:
  web_node_modules:
  web_next:
