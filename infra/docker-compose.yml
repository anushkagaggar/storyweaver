# Local mirror of production. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
name: storyweaver

services:
  api:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://storyweaver:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/storyweaver
      REDIS_URL: redis://redis:6379/0
      BLOB_BACKEND: s3local
      S3_ENDPOINT_URL: http://s3:8333
    ports:
      - "7860:7860"
    volumes:
      - ${HF_HOME_HOST:-D:/hf}:/home/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      STORYWEAVER_API_URL: http://api:7860
      STORYWEAVER_API_KEY: ${STORYWEAVER_API_KEY:?set STORYWEAVER_API_KEY in .env}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: storyweaver
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver -d storyweaver"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible stand-in for Cloudflare R2. MinIO's images were removed from Docker Hub,
  # so this uses SeaweedFS (Apache-2.0). S3 API on :8333; credentials are a global admin identity.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data

volumes:
  pg_data:
  s3_data:
  web_node_modules:
